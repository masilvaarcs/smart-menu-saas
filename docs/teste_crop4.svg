    <rect x="550" y="105" width="155" height="75" rx="10" fill="url(#metricBg)" stroke="#ffffff10" stroke-width="1"/>
    <text x="627" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#00E676" text-anchor="middle">&#10004;</text>
    <text x="627" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">TODOS OS TESTES</text>
