  <!-- Face watermark - posicao corrigida: mais acima e a direita -->
  <g filter="url(#faceGlow)">
    <circle cx="755" cy="370" r="44" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity="0.7"/>
    <image xlink:href="data:image/jpeg;base64," x="715" y="330" width="80" height="80" clip-path="url(#faceClip)" opacity="0.45"/>
    <circle cx="755" cy="370" r="40" fill="none" stroke="#ffffff30" stroke-width="1"/>
