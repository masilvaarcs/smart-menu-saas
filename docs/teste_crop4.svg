  <text x="420" y="507" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#484f58" text-anchor="middle">Evid&#234;ncia capturada em 05/04/2026 &#183; .NET 10.0.104 &#183; Windows</text>
