    <rect x="291" y="342" width="52" height="20" rx="4" fill="#4CAF50" opacity="0.7"/><text x="317" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle">EF Core</text>
