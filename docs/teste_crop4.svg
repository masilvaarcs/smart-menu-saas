    <rect x="147" y="342" width="42" height="20" rx="4" fill="#003B57" opacity="0.8"/><text x="168" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle">SQLite</text>
    <rect x="195" y="342" width="32" height="20" rx="4" fill="#FF6F00" opacity="0.8"/><text x="211" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle">JWT</text>
